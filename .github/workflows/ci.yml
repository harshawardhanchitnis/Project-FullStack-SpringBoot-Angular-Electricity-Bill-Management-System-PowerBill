name: GridIQ CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B verify

  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/pyproject.toml
      - run: pip install -e '.[dev]' pip-audit
      - run: ruff check .
      - run: pytest
      - run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build -- --configuration production
      - run: npm audit --audit-level=high

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure a demo stack with a throwaway password
        run: |
          password="ci-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          cp .env.example .env
          sed -i "s/^DEMO_MODE=.*/DEMO_MODE=true/; s/^DEMO_PASSWORD=.*/DEMO_PASSWORD=$password/" .env
          echo "E2E_DEMO_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: docker compose up --build --wait --wait-timeout 420
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down

  config-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, ml-service]
    steps:
      - uses: actions/checkout@v5
      - name: Build the ${{ matrix.service }} image
        run: docker compose build ${{ matrix.service }}
      # Fails on fixable high or critical CVEs; accepted exceptions live in .trivyignore.yaml with reasons and expiry.
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: powerbill-gridiq-${{ matrix.service }}:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
