# Weekly dependency updates. Minor and patch bumps are grouped per ecosystem so each week opens at most one pull
# request per directory; major versions arrive individually because they usually need code changes.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular"]
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ml-service
    schedule:
      interval: weekly
    groups:
      ml-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /ml-service]
    schedule:
      interval: weekly
    groups:
      base-images:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
