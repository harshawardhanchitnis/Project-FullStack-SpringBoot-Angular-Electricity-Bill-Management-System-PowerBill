spring:
  application:
    name: gridiq-core
  config:
    import:
      - optional:configtree:/run/gridiq/db/
      - optional:configtree:/run/gridiq/cache/
      - optional:configtree:/run/gridiq/ml/
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:powerbill}?currentSchema=gridiq,public
    username: ${DB_USER:powerbill}
    password: ${DB_PASSWORD:${db-password:}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:${redis-password:}}
      connect-timeout: 2s
      timeout: 2s
  flyway:
    default-schema: gridiq
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: gridiq-core
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  structured:
    format:
      console: ecs
gridiq:
  auth:
    signing-secret: ${JWT_SECRET:}
    local-signing-secret: ${jwt-local-secret:}
    cookie-secure: true
    frontend-url: ${PUBLIC_APP_URL:http://127.0.0.1:8080}
    mail-from: ${MAIL_FROM:gridiq@example.invalid}
  demo:
    enabled: ${DEMO_MODE:false}
    password: ${DEMO_PASSWORD:}
  payments:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
  ml:
    enabled: ${ML_ENABLED:true}
    url: ${ML_SERVICE_URL:http://ml-service:8000}
    api-key: ${INTERNAL_ML_API_KEY:}
    generated-api-key: ${ml-api-key:}
---
spring:
  config:
    activate:
      on-profile: dev & !prod
server:
  forward-headers-strategy: native
gridiq:
  auth:
    cookie-secure: false
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
