# The browser-facing port, so the Core API sees same-origin requests as same-origin behind the proxy.
map $http_host $gridiq_forwarded_port {
    ~:(?<port>[0-9]+)$ $port;
    default 80;
}

upstream gridiq_core {
    zone gridiq_core 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; style-src 'self'; img-src 'self' data:" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $gridiq_forwarded_port;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;

    location = /api/v1/notifications/stream {
        proxy_pass http://gridiq_core;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ^~ /api/v1/ {
        client_max_body_size 2m;
        proxy_pass http://gridiq_core;
    }

    location = /actuator/health/liveness {
        proxy_pass http://gridiq_core;
    }

    location = /actuator/health/readiness {
        proxy_pass http://gridiq_core;
    }

    location ~ ^/(api|actuator|ml|v3|swagger-ui)(/|$) {
        return 404;
    }

    location = /swagger-ui.html {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
