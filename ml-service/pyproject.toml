[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbill-gridiq-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "numpy==2.4.2",
  "prometheus-fastapi-instrumentator==8.1.0",
  "pydantic-settings==2.16.3",
  "scikit-learn==1.9.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.16.2",
  "pytest==9.2.0",
  "pytest-cov==7.0.0",
  "ruff==0.17.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
